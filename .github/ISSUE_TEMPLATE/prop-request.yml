name: Prop request
description: Ask for a drawing that is missing from the Levni Folio.
labels: ["prop request"]
body:
  - type: markdown
    attributes:
      value: |
        Search the [Library](https://levni.dev/library/) first (names and tags, English and Turkish). No logos, faces or hands: see [BRAND_LOGOS.md](https://github.com/BoraGkc/levni/blob/main/BRAND_LOGOS.md) and [CONTRIBUTING.md](https://github.com/BoraGkc/levni/blob/main/CONTRIBUTING.md).
  - type: input
    id: name
    attributes:
      label: Object
      description: One object, lowercase English, e.g. watering-can.
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Shelf
      options: [film, tv, stage, music, books, tech, money, law, sport, home, food, nature, places, health, symbols]
    validations:
      required: true
  - type: textarea
    id: use
    attributes:
      label: What scene needs it?
      description: The story or page you want to illustrate, and the angle or state you need.
    validations:
      required: true
  - type: checkboxes
    id: draw
    attributes:
      label: Drawing it yourself?
      options:
        - label: I can draw it and open a pull request (CONTRIBUTING.md explains how).
